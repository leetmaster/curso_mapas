<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <title>TIU | Interactive GIS Map</title>
</head>

<style>
    body {
      background-color: #faf0e6;
    }

    h3 {
      color: #ffffff;

    }

    h6 {
        color: #c0c0c0
    }

    p {
        color: #400200;
    }
</style>

    <form method="POST">
        <div>
            <div style="background-color:#ff5d72; text-align:left">
                <h3><img src="{{url_for('static', filename='Logo_bl.png')}}" width="140"> Interactive GIS Map</h3>
                <hr />
            </div>

            <div style="text-align:center">

                <iframe class="map", src="/mapa-generado" width="600" height="480"></iframe>
                <br/>
                <p>Este mapa muestra la distribución de 269 cafeterías independientes en Seattle, la Línea 1 del Link Light Rail y los barrios de la ciudad.</p>

                <button type="button" class="btn btn-outline-success" onclick="window.location.href='/mapa-generado'">¡VER MAPA COMPLETO!</button>
                <br/>
                <br/>
                <select name="capa" >
                    {% for key, value in tablas.items() %}
                        <option value="{{ key }}">{{ value }}</option>
                    {% endfor %}
                </select>
                <br/>
                <button type="submit" class="btn btn-outline-success">¡ DESCARGAR CAPA SELECCIONADA !</button>
                <br/>
                <br/>
                <h6>Powered by <a href="https://github.com/leetmaster/curso_mapas">@leetmaster</a></h6>
            </div>
        </div>
    </form>
</html>
